<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nib-E Store slides</title>
<!-- Microsoft Store screenshots (marketing slides). Built by render.py: 8 slides, 1920x1080 at 2x = 3840x2160 PNG. -->
<style>
  @font-face { font-family: "Brico"; font-weight: 800; src: url("../../node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2"); }
  @font-face { font-family: "Brico"; font-weight: 700; src: url("../../node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-700-normal.woff2"); }
  @font-face { font-family: "Hanken"; font-weight: 500; src: url("../../node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-500-normal.woff2"); }
  @font-face { font-family: "Hanken"; font-weight: 600; src: url("../../node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-600-normal.woff2"); }
  @font-face { font-family: "Hanken"; font-weight: 700; src: url("../../node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-700-normal.woff2"); }
  :root { --lime: #d6ff5c; --ink: #10133a; --indigo: #2f3fd6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; }
  .slide {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    font-family: "Hanken", sans-serif; color: #fff;
    background:
      radial-gradient(900px 700px at 88% 10%, rgba(120, 140, 255, 0.45), transparent 60%),
      radial-gradient(900px 800px at 0% 100%, rgba(10, 14, 90, 0.8), transparent 60%),
      linear-gradient(140deg, #2a35c9 0%, #1a2192 55%, #121665 100%);
  }
  .slide::before { /* faint grid */
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(1200px 900px at 30% 40%, #000 30%, transparent 75%);
  }
  .text { position: absolute; left: 110px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 12px; font-family: "Brico"; font-weight: 800; font-size: 40px; letter-spacing: -0.03em; margin-bottom: 34px; opacity: 0.95; }
  .brand svg { width: 40px; height: 40px; }
  .kicker { font-weight: 700; font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lime); margin-bottom: 18px; }
  h1 { font-family: "Brico"; font-weight: 800; font-size: 92px; line-height: 0.98; letter-spacing: -0.035em; margin: 0; }
  h1 .hl { color: var(--lime); }
  .sub { font-size: 31px; line-height: 1.38; font-weight: 500; color: rgba(255,255,255,0.86); margin-top: 26px; }
  .badge { display: inline-flex; align-self: flex-start; align-items: center; gap: 12px; margin-top: 34px; padding: 14px 24px; border-radius: 999px; background: var(--lime); color: var(--ink); font-weight: 700; font-size: 26px; letter-spacing: 0.02em; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 14px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); font-weight: 600; font-size: 24px; }
  .chip svg, .tool svg, .pv svg { width: 28px; height: 28px; color: var(--lime); }
  .shot { position: absolute; border-radius: 22px; background-repeat: no-repeat; background-color: #fff; box-shadow: 0 40px 90px rgba(5, 8, 50, 0.55), 0 0 0 1px rgba(255,255,255,0.18); }
  .shot.window { border-radius: 18px; }
  .callout { position: absolute; display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-radius: 16px; background: #fff; color: var(--ink); font-weight: 700; font-size: 26px; box-shadow: 0 20px 50px rgba(5, 8, 50, 0.45); }
  .badge svg, .callout svg { width: 30px; height: 30px; flex: none; }
  .callout .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--indigo); color: #fff; display: grid; place-items: center; font-size: 20px; }
  .callout.lime { background: var(--lime); }
  .arrow { position: absolute; color: var(--lime); }
  .tools { position: absolute; right: 110px; top: 150px; width: 1000px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .tool { display: flex; align-items: center; gap: 16px; padding: 20px 24px; border-radius: 16px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.16); font-weight: 600; font-size: 27px; }
  .tool .free { margin-left: auto; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink); background: var(--lime); padding: 5px 10px; border-radius: 8px; }
  .privacy { position: absolute; left: 110px; right: 110px; bottom: 70px; display: flex; gap: 14px; justify-content: space-between; }
  .pv { flex: 1; display: flex; align-items: center; gap: 12px; justify-content: center; padding: 18px; border-radius: 16px; background: rgba(0,0,0,0.22); font-weight: 600; font-size: 24px; }
  .label { position: absolute; font-weight: 700; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.8); }
  .redbar { display: inline-block; background: #000; }
  /* German: longer words, slightly smaller headlines */
  html[lang="de"] h1 { font-size: 80px; }
  html[lang="de"] .sub { font-size: 29px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
{{DEFS}}
<symbol id="i-merge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v5a4 4 0 0 0 4 4h4a4 4 0 0 1 4 4v3"/><path d="M18 4v5a4 4 0 0 1-4 4"/><path d="M15 17l3 3 3-3"/></symbol>
<symbol id="i-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6m0 0-3-3m3 3 3-3M12 21v-6m0 0-3 3m3-3 3 3M4 12h16"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></symbol>
<symbol id="i-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4.5h14V6M12 4.5v15M9 19.5h6"/></symbol>
<symbol id="i-form" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="5" rx="1.2"/><rect x="3.5" y="14" width="5" height="5" rx="1"/><path d="M11.5 16.5h9"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
</defs></svg>
<div id="slides"></div>
<script>
const I = (id) => `<svg><use href="#${id}"/></svg>`;
const BRAND = `<div class="brand">${I('i-nib')}nib-e</div>`;
// crop: a region [x, y, w, h] of a 3200x2000 capture, shown at width W
function shot(name, [x, y, w, h], W, left, top, extra = '') {
  const s = W / w;
  return `<div class="shot ${extra}" style="left:${left}px;top:${top}px;width:${W}px;height:${Math.round(h * s)}px;background-image:url(frames/${name}.png);background-size:${3200 * s}px ${2000 * s}px;background-position:${-x * s}px ${-y * s}px"></div>`;
}
// language: ?lang=de swaps the text below (the app itself is in English, so the footage stays English)
const LANG = new URLSearchParams(location.search).get('lang') || 'en';
document.documentElement.lang = LANG;
const DE_TOOLS = {"Content editor": "Inhalts-Editor", "Form filling & signature": "Ausfüllen & Signatur", "Images ↔ PDF": "Bilder ↔ PDF", "Form builder": "Formulare erstellen", "Annotations & stamps": "Kommentare & Stempel", "Page manager": "Seitenverwaltung", "File merger": "PDFs zusammenführen", "Size reducer": "Dateigröße verringern", "PDF redaction": "PDF schwärzen", "Password lock": "Passwortschutz", "Safety report": "Sicherheitsbericht", "Study mode": "Lernmodus", "FREE": "GRATIS"};
const L = (t) => (LANG === 'de' && DE_TOOLS[t]) || t;
// [English fragment, German fragment]; applied to every slide's HTML when LANG is 'de'
const DE = [["<h1>The all-in-one<br/>PDF editor.</h1>", "<h1>Der All-in-one-<br/>PDF-Editor.</h1>"], ["Every feature free · No Pro plan", "Alle Funktionen gratis · Kein Pro-Abo"], ["Fill &amp; sign</span>", "Ausfüllen &amp; signieren</span>"], ["Annotate</span>", "Kommentieren</span>"], ["Redact</span>", "Schwärzen</span>"], ["Merge &amp; pages</span>", "Seiten &amp; Zusammenführen</span>"], ["Study mode</span>", "Lernmodus</span>"], ["100% free", "100 % gratis"], ["kicker\">Fill any form</div>", "kicker\">Jedes Formular ausfüllen</div>"], ["<h1>Even forms <span class=\"hl\">without</span> fillable fields.</h1>", "<h1>Auch Formulare <span class=\"hl\">ohne</span> Formular&shy;felder.</h1>"], ["Nib-E finds the boxes, lines and tick boxes. Click, type, press Tab.", "Nib-E findet Kästchen, Linien und Ankreuzfelder. Anklicken, tippen, Tab drücken."], ["boxes found for you", "Felder für Sie gefunden"], ["kicker\">Sign</div>", "kicker\">Unterschreiben</div>"], ["<h1>Sign in seconds.</h1>", "<h1>Unterschrift in Sekunden.</h1>"], ["Draw your signature once with a mouse, pen or finger, then place it on any line. Kept only on your device.", "Einmal mit Maus, Stift oder Finger zeichnen und auf jede Linie setzen. Bleibt nur auf Ihrem Gerät."], ["kicker\">Annotate</div>", "kicker\">Kommentieren</div>"], ["<h1>Highlight, comment, stamp.</h1>", "<h1>Markieren, kommen&shy;tieren, stempeln.</h1>"], ["Sticky notes, shapes, text and ready-made or your own stamps. Saved as standard PDF comments.", "Notizen, Formen, Text und fertige oder eigene Stempel. Gespeichert als normale PDF-Kommentare."], ["kicker\">Pages &amp; files</div>", "kicker\">Seiten &amp; Dateien</div>"], ["<h1>Merge, reorder, <span class=\"hl\">shrink.</span></h1>", "<h1>Zusammen&shy;führen, sortieren, <span class=\"hl\">verkleinern.</span></h1>"], ["Merge PDFs &amp; images", "PDFs &amp; Bilder zusammenführen"], ["Insert, rotate, extract", "Einfügen, drehen, herauslösen"], ["Reduce file size", "Dateigröße verringern"], ["Password (AES-256)", "Passwort (AES-256)"], ["Pages to images", "Seiten als Bilder"], ["kicker\">Redaction</div>", "kicker\">Schwärzen</div>"], ["<h1>Removed for good. <span class=\"hl\">Not just covered.</span></h1>", "<h1>Wirklich entfernt. <span class=\"hl\">Nicht nur verdeckt.</span></h1>"], ["Text under the box is deleted and picture pixels are erased. Then Nib-E checks the result.", "Text unter dem Kasten wird gelöscht, Bildpixel werden überschrieben. Danach prüft Nib-E das Ergebnis."], [">Before</div>", ">Vorher</div>"], [">After</div>", ">Nachher</div>"], ["Checked: nothing left underneath", "Geprüft: nichts mehr darunter"], ["kicker\">Study mode</div>", "kicker\">Lernmodus</div>"], ["<h1>Your PDF beside a notebook.</h1>", "<h1>Ihr PDF neben einem Notizbuch.</h1>"], ["Lined, grid or blank pages. Write with a stylus, sketch or type. Notes come back where you stopped.", "Liniert, kariert oder leer. Mit Stift schreiben, skizzieren oder tippen. Notizen kommen dort wieder, wo Sie aufgehört haben."], ["<h1>Every tool.<br/><span class=\"hl\">Zero paywalls.</span></h1>", "<h1>Alle Werkzeuge.<br/><span class=\"hl\">Keine Paywall.</span></h1>"], ["No trial, no watermark, no subscription. Open source.", "Keine Testphase, kein Wasserzeichen, kein Abo. Open Source."], ["Works offline</div>", "Funktioniert offline</div>"], ["No account, no tracking", "Kein Konto, kein Tracking"], ["No uploads", "Keine Uploads"], ["No ads", "Keine Werbung"]];
const S = [];
// 1 — hero
S.push(`<div class="text">${BRAND}
  <h1>The all-in-one<br/>PDF editor.</h1>
  <div class="badge">${I('i-check')}Every feature free · No Pro plan</div>
  <div class="chips">
    <span class="chip">${I('i-fill')}Fill &amp; sign</span><span class="chip">${I('i-stamp')}Annotate</span><span class="chip">${I('i-redact')}Redact</span>
    <span class="chip">${I('i-pages')}Merge &amp; pages</span><span class="chip">${I('i-study')}Study mode</span><span class="chip">${I('i-offline')}Offline</span>
  </div></div>
  ${shot('annotate', [0, 0, 3200, 2000], 1060, 780, 150, 'window')}
  ${shot('sign_done', [780, 820, 1150, 330], 520, 800, 720)}
  <div class="callout lime" style="left:1560px;top:96px">${I('i-check')}100% free</div>`);
// 2 — fill
S.push(`<div class="text">${BRAND}<div class="kicker">Fill any form</div>
  <h1>Even forms <span class="hl">without</span> fillable fields.</h1>
  <div class="sub">Nib-E finds the boxes, lines and tick boxes. Click, type, press Tab.</div></div>
  ${shot('ask', [560, 160, 1660, 1000], 960, 830, 120)}
  ${shot('fill6', [760, 400, 1300, 760], 640, 1160, 560)}
  <div class="callout" style="left:780px;top:760px"><span class="dot">9</span>boxes found for you</div>`);
// 3 — sign
S.push(`<div class="text">${BRAND}<div class="kicker">Sign</div>
  <h1>Sign in seconds.</h1>
  <div class="sub">Draw your signature once with a mouse, pen or finger, then place it on any line. Kept only on your device.</div></div>
  ${shot('sign10', [870, 470, 1460, 800], 900, 860, 120)}
  ${shot('sign_done', [700, 300, 1400, 900], 720, 1100, 520)}`);
// 4 — annotate
S.push(`<div class="text">${BRAND}<div class="kicker">Annotate</div>
  <h1>Highlight, comment, stamp.</h1>
  <div class="sub">Sticky notes, shapes, text and ready-made or your own stamps. Saved as standard PDF comments.</div></div>
  ${shot('annotate', [660, 135, 1580, 1100], 1000, 820, 170)}`);
// 5 — pages
S.push(`<div class="text">${BRAND}<div class="kicker">Pages &amp; files</div>
  <h1>Merge, reorder, <span class="hl">shrink.</span></h1>
  <div class="chips">
    <span class="chip">${I('i-merge')}Merge PDFs &amp; images</span><span class="chip">${I('i-pages')}Insert, rotate, extract</span>
    <span class="chip">${I('i-compress')}Reduce file size</span><span class="chip">${I('i-lock')}Password (AES-256)</span><span class="chip">${I('i-image')}Pages to images</span>
  </div></div>
  ${shot('pages', [0, 120, 3200, 1880], 1040, 800, 150, 'window')}`);
// 6 — redact
S.push(`<div class="text">${BRAND}<div class="kicker">Redaction</div>
  <h1>Removed for good. <span class="hl">Not just covered.</span></h1>
  <div class="sub">Text under the box is deleted and picture pixels are erased. Then Nib-E checks the result.</div></div>
  <div class="label" style="left:820px;top:150px">Before</div>
  ${shot('redact2', [780, 330, 1360, 480], 900, 820, 190)}
  <div class="label" style="left:960px;top:560px">After</div>
  ${shot('redact3', [780, 330, 1360, 480], 900, 960, 600)}
  <div class="callout lime" style="left:1180px;top:920px">${I('i-check')}Checked: nothing left underneath</div>`);
// 7 — study
S.push(`<div class="text">${BRAND}<div class="kicker">Study mode</div>
  <h1>Your PDF beside a notebook.</h1>
  <div class="sub">Lined, grid or blank pages. Write with a stylus, sketch or type. Notes come back where you stopped.</div></div>
  ${shot('study6', [480, 130, 2700, 1650], 1040, 790, 150, 'window')}`);
// 8 — all tools, free + privacy
const tools = [['i-text', 'Content editor'], ['i-fill', 'Form filling & signature'], ['i-form', 'Form builder'], ['i-stamp', 'Annotations & stamps'], ['i-pages', 'Page manager'], ['i-merge', 'File merger'], ['i-compress', 'Size reducer'], ['i-redact', 'PDF redaction'], ['i-lock', 'Password lock'], ['i-shield', 'Safety report'], ['i-image', 'Images ↔ PDF'], ['i-study', 'Study mode']];
S.push(`<div class="text" style="justify-content:flex-start;padding-top:150px">${BRAND}
  <h1>Every tool.<br/><span class="hl">Zero paywalls.</span></h1>
  <div class="sub">No trial, no watermark, no subscription. Open source.</div></div>
  <div class="tools">${tools.map(([i, n]) => `<div class="tool">${I(i)}${L(n)}<span class="free">${L('FREE')}</span></div>`).join('')}</div>
  <div class="privacy">
    <div class="pv">${I('i-offline')}Works offline</div><div class="pv">${I('i-eye')}No account, no tracking</div>
    <div class="pv">${I('i-shield')}No uploads</div><div class="pv">${I('i-check')}No ads</div>
  </div>`);
if (LANG === 'de') S.forEach((h, i) => { for (const [en, de] of DE) { if (!h.includes(en)) continue; h = h.split(en).join(de); } S[i] = h; });
document.getElementById('slides').innerHTML = S.map((h, i) => `<section class="slide" id="s${i + 1}">${h}</section>`).join('');
window.ready = document.fonts.ready.then(() => Promise.all([...new Set([...document.querySelectorAll('.shot')].map((e) => e.style.backgroundImage.slice(5, -2)))].map((u) => new Promise((r) => { const im = new Image(); im.onload = r; im.src = u; }))));
</script>
</body>
</html>
