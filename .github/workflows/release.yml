# One button for a new desktop version:
#   Actions → Release → Run workflow → enter the new version (e.g. 0.5.1)
# It sets the version everywhere, builds Windows, macOS and Linux installers on
# GitHub's computers (free for public repositories), uploads them to a hidden
# (draft) release, adds fingerprints (SHA256SUMS.txt) and publishes the release
# once every build has succeeded. All steps address the release by its id.
# Leave the version empty to rebuild the current version (only if it was never released).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, three numbers (e.g. 0.5.1). Empty = current version."
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      release_id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set the new version
        if: inputs.version != ''
        env:
          V: ${{ inputs.version }}
        run: |
          node scripts/set-version.mjs "$V"
          if git diff --quiet; then echo "Version is already $V"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Version $V"
          git push

      - id: v
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stop if this version was released already; remove old drafts
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # A published release is found by its tag; drafts are not.
          if gh api "repos/$REPO/releases/tags/v$V" --silent 2>/dev/null; then
            echo "::error::Version $V is already published. Run again with a new version number (e.g. one higher)."
            exit 1
          fi
          # Drafts left over from an earlier, failed run of the same version.
          for id in $(gh api "repos/$REPO/releases" --paginate -q ".[] | select(.draft and .tag_name == \"v$V\") | .id"); do
            echo "Removing old draft $id"
            gh api -X DELETE "repos/$REPO/releases/$id"
          done

      - name: Create the release (hidden until all builds succeed)
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.v.outputs.sha }}
          REPO: ${{ github.repository }}
          STORE_ID: ${{ vars.MS_STORE_ID }}
        run: |
          # Windows: point to the Microsoft Store first once the listing exists.
          if [[ "$STORE_ID" =~ ^[A-Za-z0-9]{12}$ ]]; then
            printf '**Windows: get Nib-E from the [Microsoft Store](https://apps.microsoft.com/detail/%s)**: no warning, automatic updates. The installers below are for people who prefer not to use the Store.\n\n' "$STORE_ID" > notes.md
          else
            : > notes.md
          fi
          cat .github/release-notes.md >> notes.md
          # Created through the API so its id comes straight back (the builds upload to this id).
          id=$(gh api -X POST "repos/$REPO/releases" \
            -f tag_name="v$V" -f target_commitish="$SHA" -f name="Nib-E $V" \
            -F draft=true -F prerelease=false -F body=@notes.md -q .id)
          if [[ -z "$id" ]]; then echo "::error::Could not create the release."; exit 1; fi
          echo "Draft release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Rebuild the website with the new version
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "Website workflow not found; it updates on the next push."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Linux build tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Check the release id
        env:
          RID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          if [[ -z "$RID" ]]; then echo "::error::No release id from the prepare job; the installers would not be uploaded."; exit 1; fi

      - name: Build the installers
        shell: bash
        env:
          # "Get the latest version" in Settings opens this page in the browser.
          NIB_WEBSITE: https://github.com/${{ github.repository }}/releases/latest
          VITE_NIB_REPO: https://github.com/${{ github.repository }}
        run: npm run tauri build -- ${{ matrix.args }}

      # Uploaded by this script (not by a third-party action), so every file is
      # checked and a missing upload stops the release.
      - name: Upload the installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ needs.prepare.outputs.release_id }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          b=src-tauri/target
          files=(
            $b/release/bundle/nsis/*.exe $b/release/bundle/msi/*.msi
            $b/release/bundle/deb/*.deb $b/release/bundle/appimage/*.AppImage
            $b/universal-apple-darwin/release/bundle/dmg/*.dmg
          )
          if [[ ${#files[@]} -eq 0 ]]; then echo "::error::No installer files were built."; exit 1; fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            # A re-run replaces a file of the same name.
            for old in $(gh api "repos/$REPO/releases/$RID/assets" --paginate -q ".[] | select(.name == \"$name\") | .id"); do
              gh api -X DELETE "repos/$REPO/releases/assets/$old"
            done
            echo "Uploading $name ($(wc -c < "$f") bytes)"
            curl -fsS --retry 3 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=$name" > /dev/null
          done

  # Microsoft Store package (MSIX). Runs only once the Store identity is set up
  # (repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_NAME;
  # see STORE.md). The package is not added to the public release: download it
  # from this run's "Artifacts" and upload it in Partner Center.
  msix:
    needs: prepare
    if: vars.MSIX_IDENTITY_NAME != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - name: Build the Store edition (no installer)
        env:
          # Store edition: the Store installs updates, so no "latest version" link.
          NIB_EDITION: store
          VITE_NIB_EDITION: store
          VITE_NIB_REPO: https://github.com/${{ github.repository }}
        run: npm run tauri build -- --no-bundle
      - name: Make the Store package
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: ./scripts/msix/build-msix.ps1 -Version "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Nib-E-${{ needs.prepare.outputs.version }}-store-msix
          # The .msix for Partner Center, plus the unpacked files and
          # test-local.ps1 to try the Store edition on your own PC first.
          path: dist-msix/

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Add fingerprints and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ needs.prepare.outputs.release_id }}
          REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          # Everything works with the release id: drafts have no tag yet.
          gh api "repos/$REPO/releases/$RID/assets" --paginate -q '.[] | select(.name != "SHA256SUMS.txt") | "\(.id)\t\(.name)"' > list.tsv
          rm -f SHA256SUMS.txt
          n=$(wc -l < list.tsv)
          echo "Installers on the release: $n"
          if [[ "$n" -eq 0 ]]; then
            echo "::error::The builds uploaded no installers to the release. Open a build job and look at the upload step."
            exit 1
          fi
          while IFS=$'\t' read -r aid name; do
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$aid" > "$name"
          done < list.tsv
          rm list.tsv
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: text/plain" \
            --data-binary @SHA256SUMS.txt \
            "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=SHA256SUMS.txt" > /dev/null
          gh api -X PATCH "repos/$REPO/releases/$RID" -F draft=false -f make_latest=true -q '.html_url'
